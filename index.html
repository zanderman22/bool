<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1" />
<meta name="theme-color" content="#0b0b1a" />
<title>Bool</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b0b1a'/%3E%3Ccircle cx='12' cy='19' r='6' fill='%23ff416c'/%3E%3Ccircle cx='22' cy='13' r='4' fill='%23ffcc00'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./src/styles.css" />
</head>
<body>

<canvas id="c"></canvas>

<!-- Bottom HUD -->
<div id="hud" class="hud hidden">
  <div class="side" id="side1">
    <div class="pname" id="p1Name">You</div>
    <div class="dots" id="p1Dots"></div>
  </div>

  <div class="centre">
    <div class="score"><span id="s1">0</span><i>–</i><span id="s2">0</span></div>
    <div class="turn" id="turnLabel">Your throw</div>
  </div>

  <div class="side right" id="side2">
    <div class="pname" id="p2Name">Opponent</div>
    <div class="dots" id="p2Dots"></div>
  </div>
</div>

<!-- Level banner -->
<div id="banner" class="banner hidden"><span id="bannerText"></span></div>

<!-- Setup -->
<section id="screen-setup" class="screen">
  <div class="card">
    <p class="eyebrow">BOOL</p>
    <h1>Closest wins.</h1>
    <p class="blurb">Pull back, aim, release. Three boules each, nearest to the jack takes the end.</p>

    <label class="field">
      <span>Your name</span>
      <input id="name1" maxlength="12" placeholder="You" autocomplete="nickname" />
    </label>

    <label class="field hidden" id="name2Field">
      <span>Player two</span>
      <input id="name2" maxlength="12" placeholder="Opponent" autocomplete="nickname" />
    </label>

    <button id="btnLocal">Two players</button>
    <button id="btnSolo" class="secondary">Practise solo</button>
    <p class="foot">Online play comes later — the engine already records matches as shot events, which is all a networked game needs to send.</p>
  </div>
</section>

<!-- End of an end -->
<section id="screen-endover" class="screen hidden">
  <div class="card">
    <p class="eyebrow" id="eoEyebrow">END COMPLETE</p>
    <h2 id="eoTitle">Result</h2>
    <p class="blurb" id="eoDetail"></p>
    <button id="btnNext">Next level</button>
    <button id="btnQuit" class="secondary">Main menu</button>
  </div>
</section>

<!-- Match over -->
<section id="screen-matchover" class="screen hidden">
  <div class="card">
    <p class="eyebrow">MATCH COMPLETE</p>
    <h1 id="moTitle">Winner</h1>
    <p class="blurb" id="moDetail"></p>
    <button id="btnRematch">Rematch</button>
    <button id="btnQuit2" class="secondary">Main menu</button>
  </div>
</section>

<script type="module" src="./src/main.js"></script>
</body>
</html>
